<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>overlap fixture</title>
<style>
  body { margin:0; background:#fff; color:#111; font:14px sans-serif; }
  .wrap { position:relative; width:300px; height:120px; }
  .task { position:absolute; top:20px; left:20px; }
  .label-a { position:absolute; top:40px; left:40px; }
  .label-b { position:absolute; top:48px; left:48px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="task">ready</div>
  <div class="label-a">Overlapping label A</div>
  <div class="label-b">Overlapping label B</div>
</div>
</body>
</html>
