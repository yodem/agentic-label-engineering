<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>ALE run board</title>
<style>
:root{
  --bg:#F1F3F5;--surface:#FFFFFF;--raised:#F7F8FA;--text:#17202B;--text-2:#44505E;--text-3:#5E6977;
  --border:#DCE1E6;--border-strong:#5E6977;--selected:#E6EEFB;--focus:#FDE68A;--scrim:rgba(23,32,43,.32);
  --needs:#B45309;--needs-tint:#FEF3C7;--fail:#B91C1C;--fail-tint:#FEE2E2;--run:#1D4ED8;--run-tint:#DBEAFE;
  --verify:#6D28D9;--verify-tint:#EDE9FE;--ready:#0F766E;--ready-tint:#CCFBF1;--wait:#44505E;--wait-tint:#E9EDF1;
  --done:#15803D;--done-tint:#DCFCE7;--cancel:#5E6977;--cancel-tint:#E9EDF1;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.25,1,.5,1);--ease-in:cubic-bezier(.5,0,.75,0);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161C;--surface:#19202A;--raised:#1E2632;--text:#EDF1F5;--text-2:#C3CCD6;--text-3:#93A0AE;
  --border:#2B3542;--border-strong:#93A0AE;--selected:#1D2F4F;--focus:#FDE68A;--scrim:rgba(0,0,0,.55);
  --needs:#FBBF24;--needs-tint:#3A2A0A;--fail:#F87171;--fail-tint:#3F1414;--run:#60A5FA;--run-tint:#152542;
  --verify:#A78BFA;--verify-tint:#2A1C4F;--ready:#2DD4BF;--ready-tint:#0B2E2B;--wait:#C3CCD6;--wait-tint:#222B36;
  --done:#4ADE80;--done-tint:#0F2E1C;--cancel:#93A0AE;--cancel-tint:#222B36;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11161C;--surface:#19202A;--raised:#1E2632;--text:#EDF1F5;--text-2:#C3CCD6;--text-3:#93A0AE;
  --border:#2B3542;--border-strong:#93A0AE;--selected:#1D2F4F;--focus:#FDE68A;--scrim:rgba(0,0,0,.55);
  --needs:#FBBF24;--needs-tint:#3A2A0A;--fail:#F87171;--fail-tint:#3F1414;--run:#60A5FA;--run-tint:#152542;
  --verify:#A78BFA;--verify-tint:#2A1C4F;--ready:#2DD4BF;--ready-tint:#0B2E2B;--wait:#C3CCD6;--wait-tint:#222B36;
  --done:#4ADE80;--done-tint:#0F2E1C;--cancel:#93A0AE;--cancel-tint:#222B36;color-scheme:dark;}
*{box-sizing:border-box}
svg[hidden]{display:none}
[hidden]{display:none!important}
html{font-size:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 .875rem/1.45 var(--sans);-webkit-font-smoothing:antialiased}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--border-strong);outline-offset:2px}
.t-needs{--c:var(--needs);--t:var(--needs-tint)}.t-fail{--c:var(--fail);--t:var(--fail-tint)}.t-run{--c:var(--run);--t:var(--run-tint)}
.t-verify{--c:var(--verify);--t:var(--verify-tint)}.t-ready{--c:var(--ready);--t:var(--ready-tint)}.t-wait{--c:var(--wait);--t:var(--wait-tint)}
.t-done{--c:var(--done);--t:var(--done-tint)}.t-cancel{--c:var(--cancel);--t:var(--cancel-tint)}

/* page frame */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.app.has-drawer{grid-template-columns:minmax(0,1fr) 440px}
.main{min-width:0;padding:0 32px 48px}
.wrap{max-width:1120px;margin:0 auto}

/* header */
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);padding:20px 0 16px;border-bottom:1px solid var(--border)}
.hdr-top{display:flex;align-items:center;gap:12px;min-width:0}
.runid{font:400 .8125rem/1.3 var(--mono);color:var(--text-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--text-2);white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--done)}
.verdict{display:flex;align-items:flex-start;gap:12px;margin:12px 0 14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 10px;border-radius:999px;background:var(--t);color:var(--c);font-weight:600;font-size:.8125rem;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--c)}
.headline{margin:0;font-size:1.5rem;line-height:1.25;font-weight:600;letter-spacing:-.01em;flex:1 1 20rem;min-width:0;text-wrap:balance}
.ribbon-row{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap}
.ribbon{display:flex;gap:2px;flex:1 1 280px;min-width:0;max-width:520px;height:14px}
.ribbon span{flex:1 1 0;min-width:0;border-radius:2px;background:var(--c)}
.ribbon span.t-wait,.ribbon span.t-ready{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.legend{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:.8125rem;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend svg{color:var(--c)}
.totals{margin-left:auto;display:flex;gap:4px 16px;flex-wrap:wrap;font-size:.75rem;color:var(--text-2)}
.totals span{white-space:nowrap}

/* sections */
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;font-size:.9375rem;font-weight:600}
.count{font:600 .75rem/1 var(--mono);color:var(--text-2);background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);border-radius:999px;padding:3px 7px}
.empty{color:var(--text-3);font-size:.8125rem;padding:10px 16px;border:1px dashed var(--border);border-radius:6px}
.group-h{display:flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--text-2);padding:8px 0 6px;min-width:0}
.group-h .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* attention */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,30rem),1fr));gap:12px}
.card{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:start;background:var(--t);border-radius:6px;padding:14px 16px 14px 20px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.card .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:999px;background:var(--surface);color:var(--c);font-weight:600;font-size:.8125rem;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--c)}
.card .id{font:600 .8125rem var(--mono);color:var(--text)}
.card .title{grid-column:1;font-size:.875rem;color:var(--text);overflow-wrap:anywhere}
.card .why{grid-column:1;margin:2px 0 0;font-size:1rem;font-weight:600;color:var(--text)}
.crit{grid-column:1;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.crit span{font:400 .75rem/1 var(--mono);padding:5px 7px;border-radius:4px;background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong)}
.card .side{grid-column:2;grid-row:1 / span 4;display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
.card .blocks{font-size:.8125rem;color:var(--text-2);white-space:nowrap}
.btn:not([hidden]){display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:0;background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong);cursor:pointer;font-weight:600;font-size:.8125rem;white-space:nowrap}
.btn.primary{background:var(--text);color:var(--surface);box-shadow:none}
.btn.quiet{background:transparent;box-shadow:none;color:var(--text-2);font-weight:400}

/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:24px}
.field{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:6px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);font-size:.8125rem;color:var(--text-2);white-space:nowrap}
.field b{font-weight:600;color:var(--text)}
.search{flex:1 1 14rem;min-width:0;color:var(--text-3)}
.search span{overflow:hidden;text-overflow:ellipsis}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent}
.field.sel-f select{flex:1;min-width:0;appearance:none;border:0;background:transparent}
.vis{font:.75rem var(--mono);color:var(--text-2);white-space:nowrap}

/* task strip */
.strips{background:var(--surface);border-radius:6px;box-shadow:inset 0 0 0 1px var(--border);overflow:hidden}
.strip{position:relative;display:grid;border:0;background:transparent;text-align:left;width:100%;font:inherit;color:inherit;grid-template-columns:var(--state-col) 6.5rem minmax(0,1fr) auto;grid-template-areas:"state id main meta";column-gap:16px;align-items:center;min-height:48px;padding:8px 16px 8px 20px;border-top:1px solid var(--border);cursor:pointer;--state-col:10.5rem}
.strip:first-child{border-top:0}
.strip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.strip.t-wait::before,.strip.t-cancel::before{background:repeating-linear-gradient(180deg,var(--c) 0 3px,transparent 3px 6px)}
.strip:hover{background:var(--raised)}
.strip.sel{background:var(--selected)}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}.breathing{animation:breathe 2s ease-in-out infinite}
.state{grid-area:state;display:flex;align-items:center;gap:6px;color:var(--c);font-weight:600;font-size:.8125rem;min-width:0}
.state .w,.state .w-raw{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.state .w-prefix{flex:none;white-space:nowrap}
.sid{grid-area:id;font:600 .8125rem var(--mono);color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smain{grid-area:main;min-width:0;overflow:hidden;text-overflow:ellipsis}
.stitle,.sreason{display:block;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stitle{color:var(--text)}
.sreason{color:var(--text-2);font-size:.8125rem}
.smeta{grid-area:meta;display:flex;flex-direction:column;align-items:flex-end;gap:1px;font:.75rem var(--mono);color:var(--text-2);white-space:nowrap}
.more{margin-top:8px}

/* drawer */
.drawer{background:var(--surface);border-left:1px solid var(--border);min-width:0;transition:transform 220ms var(--ease-out),opacity 220ms var(--ease-out)}
.drawer-in{position:sticky;top:0;max-height:100vh;overflow:auto;padding:20px 24px 32px}
.d-top{display:flex;align-items:center;gap:8px;min-width:0}
.d-top .id{font:600 .875rem var(--mono)}
.d-top .x{margin-left:auto}
.d-title{margin:10px 0 0;font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.d-why{margin:12px 0 0;padding:12px 14px;border-radius:6px;background:var(--t);font-size:1rem;color:var(--text)}
.d-h{margin:20px 0 6px;font-size:.8125rem;font-weight:600;color:var(--text-2)}
.facts{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:6px 12px;margin:0;font-size:.8125rem}
.facts dt{color:var(--text-2)}.facts dd{margin:0;overflow-wrap:anywhere}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8125rem}
.tag{display:inline-flex;height:22px;align-items:center;padding:0 8px;border-radius:999px;font-size:.75rem;color:var(--text-2);box-shadow:inset 0 0 0 1px var(--border-strong)}
.ac{font:.75rem/1.5 var(--mono);background:var(--raised);border-radius:6px;padding:10px 12px;overflow-wrap:anywhere;box-shadow:inset 0 0 0 1px var(--border)}
.ac div{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:0 10px}.ac div span:first-child,.ac b{white-space:nowrap}.ac b{color:var(--fail)}
.tl{list-style:none;margin:0;padding:0;font-size:.8125rem}
.tl li{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:8px;padding:5px 0;border-top:1px solid var(--border)}
.tl .when{color:var(--text-2);font:.75rem var(--mono);padding-top:1px}
.back{display:none}
.scrim{display:none}
.handle{display:none}
.scrim[hidden],.drawer[hidden]{display:none!important}

/* 768-1279: overlay sheet from right */
@media (max-width:1279px){
  .app.has-drawer{grid-template-columns:minmax(0,1fr)}
  .drawer{position:fixed;z-index:20;top:0;right:0;bottom:0;width:min(440px,92vw);border-left:0;box-shadow:-12px 0 32px rgba(0,0,0,.18)}
  .drawer-in{position:static;height:100%;max-height:none}
  .scrim{display:block;position:fixed;inset:0;z-index:15;background:var(--scrim)}
}
/* <900: row keeps one line but meta moves under */
@media (max-width:899px){
  .main{padding:0 16px 32px}
  .strip{grid-template-columns:var(--state-col) minmax(0,1fr) auto;grid-template-areas:"state id meta" "main main main";row-gap:4px}
  .smeta{flex-direction:row;gap:10px}
  .card{grid-template-columns:minmax(0,1fr)}
  .card .side{grid-column:1;grid-row:auto;flex-direction:row;align-items:center;justify-content:space-between;text-align:left}
  .totals{margin-left:0;width:100%}
}
/* <768: bottom sheet */
@media (max-width:767px){
  .hdr{padding:14px 0 12px}
  .headline{font-size:1.25rem;flex-basis:100%}
  .drawer{top:48px;left:0;right:0;bottom:0;width:auto;border-radius:12px 12px 0 0;box-shadow:0 -8px 32px rgba(0,0,0,.25)}
  .drawer-in{padding:8px 16px 24px}
  .handle{display:block;width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:4px auto 10px;opacity:.6}
  .back{display:inline-flex}.d-top .x{display:none}
  .strip{padding:8px 12px 8px 16px;column-gap:10px;--state-col:auto}
  .strip .state{min-width:0}
  .toolbar .field.sel-f{flex:1 1 calc(33% - 8px);justify-content:space-between;min-width:0}
  .toolbar .field.sel-f b{overflow:hidden;text-overflow:ellipsis}
  .toolbar .field.sel-f select{min-width:0;max-width:100%}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<header class="hdr" aria-live="polite"><div class="hdr-top"><span class="runid" id="run-id" title="ALE board">ALE board</span><span class="live" id="connection"><span class="dot"></span><span id="connection-word">Disconnected</span><span class="mono" id="as-of"></span></span></div>

<section class="sec" id="attention" hidden><h2 class="sec-h">Needs you <span class="count" id="attention-count">0</span></h2><div class="cards" id="cards"></div><button id="more-attention" class="btn quiet" hidden>Show more</button></section>
<div class="toolbar" id="toolbar" hidden><label class="field sel-f">Role <select id="role-filter"><option>All</option></select><svg class="i"><use href="#i-chev"></use></svg></label><label class="field sel-f">State <select id="state-filter"><option>All</option></select><svg class="i"><use href="#i-chev"></use></svg></label><label class="field sel-f">Agent <select id="agent-filter"><option>All</option></select><svg class="i"><use href="#i-chev"></use></svg></label><label class="field search"><svg class="i"><use href="#i-search"></use></svg><input id="search" type="search" placeholder="Search task id or title" aria-label="Search task id or title"></label><span class="vis" id="visible-count"></span><button class="btn quiet" id="clear" hidden>Clear filters</button></div>

<script>
